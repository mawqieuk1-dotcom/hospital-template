<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- خلفية دائرية -->
  <circle cx="250" cy="250" r="240" fill="rgba(255,255,255,0.06)"/>
  
  <!-- مبنى المستشفى -->
  <rect x="170" y="180" width="160" height="180" rx="10" fill="#00c9a7" opacity="0.9"/>
  
  <!-- نوافذ -->
  <rect x="190" y="200" width="20" height="20" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="220" y="200" width="20" height="20" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="260" y="200" width="20" height="20" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="190" y="240" width="20" height="20" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="220" y="240" width="20" height="20" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="260" y="240" width="20" height="20" rx="3" fill="#fff" opacity="0.8"/>
  
  <!-- باب المستشفى -->
  <rect x="230" y="300" width="40" height="60" rx="5" fill="#fff" opacity="0.9"/>
  <line x1="250" y1="300" x2="250" y2="360" stroke="#0a4c6b" stroke-width="1" opacity="0.5"/>
  
  <!-- صليب طبي -->
  <rect x="240" y="310" width="20" height="8" rx="2" fill="#0a4c6b"/>
  <rect x="246" y="304" width="8" height="20" rx="2" fill="#0a4c6b"/>
  
  <!-- سقف -->
  <polygon points="160,180 250,120 340,180" fill="#0a4c6b" opacity="0.8"/>
  
  <!-- قلب صحي -->
  <path d="M100 100 C60 50 10 90 10 130 C10 190 100 240 100 240 C100 240 190 190 190 130 C190 90 140 50 100 100Z" fill="rgba(255,255,255,0.08)"/>
  
  <!-- نبضة -->
  <polyline points="400,150 420,150 430,120 450,180 470,150 490,150" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- نجوم صغيرة -->
  <circle cx="80" cy="350" r="3" fill="#fff" opacity="0.3"/>
  <circle cx="420" cy="100" r="4" fill="#fff" opacity="0.3"/>
  <circle cx="450" cy="380" r="2" fill="#fff" opacity="0.3"/>
</svg>